name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already carries an Android SDK; the setup-android action tries to re-accept
      # licences with a newer sdkmanager and fails there. Accepting them ourselves is two lines
      # and does not depend on the action's own idea of what is installed.
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BIN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$BIN" ] || BIN="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $BIN"
          yes | "$BIN" --licenses > /dev/null 2>&1 || true
          "$BIN" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fetch the Xray kernel
        run: ./scripts/fetch-core.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Собранный APK проверяем до того, как он станет артефактом: 0.8.4 уехала в релиз
      # без ядра Xray, и заметили это только на телефоне.
      - name: Проверить APK
        run: ./scripts/check-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: byecensor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
